        - data.pattern.access.behavior.distortion.noise.min
        - data.pattern.access.behavior.distortion.noise.max
        - data.pattern.access.behavior.memory.interval
        - data.pattern.access.behavior.memory.offset
        - data.pattern.temporal.burstiness.high
        - data.pattern.temporal.burstiness.low
        - data.pattern.temporal.burstiness.hours.start
        - data.pattern.temporal.burstiness.hours.end
        - data.pattern.temporal.periodic.scale
        - data.pattern.temporal.periodic.amplitude
