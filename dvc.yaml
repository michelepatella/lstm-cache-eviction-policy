stages:
  data_generation:
    cmd: PYTHONPATH=src python -m pipeline.steps.data_generator
    params:
      - src/pipeline/config/config.yaml:
        - data.seed
        - data.mode
        - data.requests
        - data.keys.min
        - data.keys.max
        - data.pattern.access.zipf.alpha.fixed
