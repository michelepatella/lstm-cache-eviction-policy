        - data.pattern.access.behavior.repetition.hours.end
        - data.pattern.access.behavior.toggle.interval
        - data.pattern.access.behavior.toggle.hours.start
        - data.pattern.access.behavior.toggle.hours.end
        - data.pattern.access.behavior.toggle.base_requests.first
        - data.pattern.access.behavior.toggle.base_requests.second
        - data.pattern.access.behavior.toggle.offsets.forward
        - data.pattern.access.behavior.toggle.offsets.backward
        - data.pattern.access.behavior.cycle.base
        - data.pattern.access.behavior.cycle.mod
        - data.pattern.access.behavior.cycle.divisor
        - data.pattern.access.behavior.cycle.hours.start
        - data.pattern.access.behavior.cycle.hours.end
