apiVersion: apps/v1
kind: Deployment
metadata:
  name: scorer-service
  namespace: scorer-service
  labels:
    app: scorer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scorer-service
  template:
    metadata:
      labels:
        app: scorer-service
    spec:
      containers:
      - name: scorer-service
        image: lstmcacheevictionpolicy.azurecr.io/lstm-cache-eviction-policy-scorer_service:latest
        ports:
        - containerPort: 8003
        envFrom:
        - configMapRef:
            name: scorer-service-config
        securityContext:
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: "5m"
            memory: "50Mi"
          limits:
            cpu: "50m"
            memory: "250Mi"
      imagePullSecrets:
        - name: acr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: scorer-service
  namespace: scorer-service
spec:
  selector:
    app: scorer-service
  type: ClusterIP
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8003
