apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: lstmcacheevictionpolicy.azurecr.io/lstm-cache-eviction-policy-api_gateway:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: api-gateway-config
        - secretRef:
            name: api-gateway-secrets
        securityContext:
          runAsNonRoot: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: "5m"
            memory: "50Mi"
          limits:
            cpu: "50m"
            memory: "250Mi"
      imagePullSecrets:
        - name: acr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: api-gateway
spec:
  selector:
    app: api-gateway
  type: LoadBalancer
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
