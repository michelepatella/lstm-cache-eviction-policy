apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: decider-service
spec:
  podSelector:
    matchLabels:
      app: decider-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: [ ]
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to: [ ]
