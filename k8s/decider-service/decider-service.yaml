apiVersion: apps/v1
kind: Deployment
metadata:
  name: decider-service
  namespace: decider-service
  annotations:
    kube-score/ignore: pod-networkpolicy,networkpolicy-targets-pod
  labels:
    app: decider-service
    role: decider-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: decider-service
      role: decider-service
  template:
    metadata:
      annotations:
        kube-score/ignore: pod-networkpolicy,networkpolicy-targets-pod
      labels:
        app: decider-service
        role: decider-service
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 2000
      containers:
      - name: decider-service
        image: lstmcacheevictionpolicy.azurecr.io/decider-service:PLACEHOLDER_SHA
        imagePullPolicy: Always
        ports:
        - containerPort: 8004
        readinessProbe:
          exec:
            command:
              - sh
              - -c
              - "echo ready"
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
              - sh
              - -c
              - "echo ok"
          initialDelaySeconds: 10
          periodSeconds: 15
        envFrom:
        - configMapRef:
            name: decider-service-config
        securityContext:
          readOnlyRootFilesystem: false
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: "5m"
            memory: "50Mi"
            ephemeral-storage: "50Mi"
          limits:
            cpu: "50m"
            memory: "250Mi"
            ephemeral-storage: "500Mi"
      imagePullSecrets:
        - name: acr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: decider-service
  namespace: decider-service
spec:
  selector:
    app: decider-service
    role: decider-service
  type: ClusterIP
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8004
