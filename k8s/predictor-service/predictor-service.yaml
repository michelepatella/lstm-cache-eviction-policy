apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictor-service
  namespace: predictor-service
  annotations:
    kube-score/ignore: pod-networkpolicy,networkpolicy-targets-pod
  labels:
    app: predictor-service
    role: predictor-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: predictor-service
      role: predictor-service
  template:
    metadata:
      annotations:
        kube-score/ignore: pod-networkpolicy,networkpolicy-targets-pod
      labels:
        app: predictor-service
        role: predictor-service
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 2000
      containers:
      - name: predictor-service
        image: europe-west8-docker.pkg.dev/lstm-cache-eviction-policy/lstm-cache-eviction-policy-cr/predictor-service:PLACEHOLDER_SHA
        imagePullPolicy: Always
        ports:
        - containerPort: 8002
        readinessProbe:
          exec:
            command:
              - sh
              - -c
              - "echo ready"
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
              - sh
              - -c
              - "echo ok"
          initialDelaySeconds: 10
          periodSeconds: 15
        volumeMounts:
        - name: predictor-service-secrets
          mountPath: /etc/secrets
          readOnly: true
        - name: tmp
          mountPath: /tmp
        env:
          - name: TMPDIR
            value: /tmp
          - name: TEMP
            value: /tmp
          - name: TMP
            value: /tmp
        envFrom:
        - configMapRef:
            name: predictor-service-config
        - secretRef:
            name: predictor-service-secrets
        securityContext:
          readOnlyRootFilesystem: true
          runAsUser: 10001
          runAsGroup: 10001
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
            ephemeral-storage: "100Mi"
          limits:
            cpu: "250m"
            memory: "512Mi"
            ephemeral-storage: "100Mi"
      volumes:
      - name: predictor-service-secrets
        secret:
          secretName: predictor-service-secrets
      - name: tmp
        emptyDir: { }
---
apiVersion: v1
kind: Service
metadata:
  name: predictor-service
  namespace: predictor-service
spec:
  selector:
    app: predictor-service
    role: predictor-service
  type: ClusterIP
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8002
