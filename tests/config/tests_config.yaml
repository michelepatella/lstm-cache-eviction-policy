data:
  processed:
    integrity:
      feature_feature_correlation:
        num_pairs: 2
        threshold: 0.8
      feature_label_correlation:
        threshold: 0.8
      percent_of_nulls:
        threshold: 0.0
  raw:
    integrity:
      feature_feature_correlation:
        num_pairs: 2
        threshold: 0.8
      feature_label_correlation:
        threshold: 0.8
      percent_of_nulls:
        threshold: 0.2
seed:
  value: 42
train_test_validation:
  datasets_size_comparison:
    ratio: 0.2
  feature_drift:
    allowed_num_features_exceeding_threshold: 1
    max_allowed_numeric_score: 0.2
  feature_label_correlation_change:
    threshold: 0.2
  index_leakage:
    max_ratio: 0.0
  label_drift:
    max_allowed_drift_score: 0.25
  multivariate_drift:
    max_drift_value: 0.25
