data:
  processed:
    integrity:
      feature_feature_correlation:
        num_pairs: 2
        threshold: 0.8
      feature_label_correlation:
        threshold: 0.8
      percent_of_nulls:
        threshold: 0.0
  raw:
    integrity:
      feature_feature_correlation:
        num_pairs: 2
        threshold: 0.8
      feature_label_correlation:
        threshold: 0.8
      percent_of_nulls:
        threshold: 0.2
  train_test_validation:
    datasets_size_comparison:
      ratio: 0.2
    feature_drift:
      allowed_num_features_exceeding_threshold: 1
      max_allowed_numeric_score: 0.2
    feature_label_correlation_change:
      threshold: 0.2
    index_leakage:
      max_ratio: 0.0
    label_drift:
      max_allowed_drift_score: 0.25
    multivariate_drift:
      max_drift_value: 0.25
model:
  performance:
    simple_model_comparison:
      min_allowed_gain: 0.1
      scorers: ["accuracy", "precision_macro", "recall_macro", "f1_macro", "precision_weighted", "recall_weighted", "f1_weighted"]
      strategy: most_frequent
    train_test_performance:
      degradation_threshold: 0.1
      test_min_score: 0.7
      scorers: ["accuracy", "precision_macro", "recall_macro", "f1_macro", "precision_weighted", "recall_weighted", "f1_weighted"]
    confusion_matrix_report:
      misclassified_samples_threshold: 0.2
  training:
    learnability:
      target_avg_loss: 0.1
      avg_loss_tolerance: 0.5
    reproducibility:
      avg_loss_tolerance: 0.000005
