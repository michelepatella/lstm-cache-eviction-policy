data:
  processed:
    integrity:
      feature_feature_correlation:
        num_pairs: 2
        threshold: 0.8
      feature_label_correlation:
        threshold: 0.8
      percent_of_nulls:
        threshold: 0.0
  raw:
    integrity:
      feature_feature_correlation:
        num_pairs: 2
        threshold: 0.8
      feature_label_correlation:
        threshold: 0.8
      percent_of_nulls:
        threshold: 0.2
model:
  confusion_matrix_report:
    misclassified_samples_threshold: 0.2
  inference_time:
    threshold: 0.001
  performance_bias:
    lower_bound: 0.1
    scorer: f1_weighted
  roc_report:
    min_auc: 0.7
  simple_model_comparison:
    min_allowed_gain: 0.1
    scorers: ["f1_weighted"]
    strategy: most_frequent
  single_dataset_performance:
    class_mode: any
    scorers: ["f1_weighted"]
    threshold: 0.9
  train_test_performance:
    degradation_threshold: 0.1
    imbalance_threshold: 0.3
    test_min_score: 0.8
    score: f1
    scorers: ["f1_weighted"]
  unused_features:
    max_high_variance_unused_features: 0
  weak_segments_performance:
    alternative_scorer: {"f1_weighted": "f1_weighted"}
    max_ratio_change: 0.2
seed:
  value: 42
train_test_validation:
  datasets_size_comparison:
    ratio: 0.2
  feature_drift:
    allowed_num_features_exceeding_threshold: 1
    max_allowed_numeric_score: 0.2
  feature_label_correlation_change:
    threshold: 0.2
  index_leakage:
    max_ratio: 0.0
  label_drift:
    max_allowed_drift_score: 0.25
  multivariate_drift:
    max_drift_value: 0.25
