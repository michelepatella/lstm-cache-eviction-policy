    params:
      src/pipeline/config/config.yaml:
        data.keys.max: 10
        data.keys.min: 1
        data.mode: static
        dataset.split.training: 0.7
        hardware.device: mps
        model.general.features: 2
        model.params:
          batch_first: true
          bias: false
          bidirectional: false
          dropout: 0.3
          hidden_size: 128
          num_layers: 2
          proj_size: 0
        model.sequence.embedding.dimension: 32
        model.sequence.length: 25
        training.early_stopping.delta: 0.0001
        training.early_stopping.patience: 10
        training.general.batch_size: 128
        training.general.shuffle: true
        training.optimizer.params.learning_rate: 0.0005
        training.optimizer.params.weight_decay: 0.05
        training.optimizer.type: adamw
        validation.cross_validation.epochs: 5
        validation.cross_validation.folds: 5
        validation.early_stopping.delta: 0.0005
        validation.early_stopping.patience: 5
        validation.general.batch_size: 128
        validation.general.shuffle: false
        validation.search_space:
          model:
            dropout:
            - 0.1
            - 0.3
            hidden_size:
            - 128
            - 256
            num_layers:
            - 2
            - 3
          training:
            optimizer:
              learning_rate:
              - 0.001
              - 0.0005
