    params:
      src/pipeline/config/pipeline_config.yaml:
        data.general.keys.max: 100
        data.general.keys.min: 1
        data.general.mode: dynamic
        data_loader.training.batch_size: 512
        data_loader.training.shuffle: false
        data_loader.validation.batch_size: 512
        data_loader.validation.shuffle: false
        dataset.splits.training: 0.8
        early_stopping.training.delta: 0.0001
        early_stopping.training.patience: 10
        early_stopping.validation.delta: 0.0005
        early_stopping.validation.patience: 3
        logs.level: DEBUG
        loss.class_weight.type: balanced
        loss.reduction:
        model.params.batch_first: true
        model.params.bias: false
        model.params.bidirectional: false
        model.params.dropout: 0.1
        model.params.hidden_size: 256
        model.params.num_layers: 2
        model.params.proj_size: 0
        model.sequence.embedding.dimension: 32
        model.sequence.length: 25
        optimizer.params.learning_rate: 0.0005
        optimizer.params.weight_decay: 0.05
        optimizer.type: adamw
        resources.devices.validation: cpu
        resources.general.num_cpus: 4
        resources.general.num_gpus: 0
        seed.value: 42
        validation.search_space.model.dropout:
        - 0.1
        - 0.3
        validation.search_space.model.hidden_size:
        - 128
        - 256
        validation.search_space.model.num_layers:
        - 2
        - 3
        validation.search_space.optimizer.learning_rate:
        - 0.001
        - 0.0005
        validation.time_series_cv.epochs: 5
        validation.time_series_cv.folds: 5
