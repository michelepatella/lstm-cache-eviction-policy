groups:
  - name: api_alerts
    rules:
      - alert: HighAPILatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Total API latency (p95) > 3s"
      - alert: LowHTTPSuccessRate
        expr: 100 * (1 - sum(rate(http_requests_total{status=~"2.."}[5m])) / sum(rate(http_requests_total[5m]))) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP Success Rate (%) < 95%"

  - name: service_alerts
    rules:
      - alert: FeaturizerHighLatency
        expr: histogram_quantile(0.95, sum(rate(featurizer_latency_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Featurizer latency (p95) > 500ms"
      - alert: PredictorHighLatency
        expr: histogram_quantile(0.95, sum(rate(predictor_latency_seconds_bucket[5m])) by (le)) > 1.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Predictor latency (p95) > 1.5s"
      - alert: ScorerHighLatency
        expr: histogram_quantile(0.95, sum(rate(scorer_latency_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scorer latency (p95) > 500ms"
      - alert: DeciderHighLatency
        expr: histogram_quantile(0.95, sum(rate(decider_latency_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Decider latency (p95) > 500ms"

  - name: infra_alerts
    rules:
      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[1m]) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API CPU Usage (%) > 85%"
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes > 450000000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API Memory Usage > 450MB"
