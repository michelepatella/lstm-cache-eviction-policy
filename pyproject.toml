[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["ALL"]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
markers = [
    "api_empty_input: API Empty Input Test",
    "api_loading_artifacts: API Loading Artifacts Test",
    "api_none_input: API None Input Test",
    "api_prediction: API Prediction Test",
    "api_wrong_input_type: API Wrong Input Type Test",
    "code_encode_time_trigonometrically: Encode Time Trigonometrically Test",
    "code_calculate_local_frequencies: Calculate Local Frequencies Test",
    "code_calculate_local_recencies: Calculate Local Recencies Test",
    "data_integrity_raw: Data Raw Integrity Tests with DeepChecks",
    "data_integrity_processed: Data Processed Integrity Tests with DeepChecks",
    "data_quality_raw: Data Raw Quality Tests with Great Expectations",
    "data_quality_processed: Data Processed Quality Tests with Great Expectations",
    "data_train_test_validation: Data Train-Test-Validation Tests with DeepChecks",
    "model_behavioral_invariance: Model Behavioral Invariance Tests",
    "model_behavioral_invariance_feature_perturbation: Model Behavioral Invariance Feature Perturbation Tests",
    "model_behavioral_invariance_identity: Model Behavioral Invariance Identity Test",
    "model_behavioral_directional: Model Behavioral Directional Tests",
    "model_behavioral_directional_local_feature_perturbations: Model Behavioral Directional Local Feature Perturbations Tests",
    "model_behavioral_minimum_functionality: Model Behavioral Minimum Functionality Tests",
    "model_inference: Model Inference Tests",
    "model_inference_avg_latency: Model Inference Avg Latency Test",
    "model_inference_throughput: Model Inference Throughput Test",
    "model_performance: Model Performance Tests with DeepChecks",
    "model_training: Model Training Tests",
    "model_training_end_to_end: Model Training End-To-End Test",
    "model_training_learnability: Model Training Learnability Test",
    "model_training_optimization_stability: Model Training Optimization Stability Test",
    "model_training_output_integrity: Model Training Output Integrity Test",
    "model_training_portability: Model Training Portability Tests",
    "slow: Slow Tests",
    "data_processing: Tests to run during data processing in the pipeline",
    "data_exploration: Tests to run during data exploration in the pipeline",
    "validation: Tests to run during validation in the pipeline",
    "training: Tests to run during training in the pipeline",
    "testing: Tests to run during testing in the pipeline",
]
