# Drift Detection: Check for any data, target,
# and prediction drift and send an alert if any
# drift detected
name: Drift Detection

# Kill the current workflow if a
# new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Run the workflow on demand and every day at midnight
on:
  workflow_dispatch:
  #schedule:
  #  - cron: '0 0 * * *'

# The workflow is organized into a single job:
# - Detect drift:
#     - Checkout repository:
#         Checkout the repository on the current branch.
#     - Set environment variables:
#         Load and set environment variables required.
#     - Detect drift:
#         Run the drift detection script.
#     - Upload drift reports:
#         Upload drift reports as artifact.
#     - Trigger drift alert
#         Trigger a drift alert if any drift detected
jobs:

  # ----------------------------------------
  # Detect drift
  # ----------------------------------------
  drift_detection:
    runs-on: self-hosted
    steps:
      # Checkout the repository on
      # the current branch
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref || github.ref }}

      # Set environment variables needed
      - name: Set environment variables
        env:
          DAGS_HUB_TOKEN: ${{ secrets.DAGS_HUB_TOKEN }}
          GRAFANA_LOKI_USER_ID: ${{ secrets.GRAFANA_LOKI_USER_ID }}
          GRAFANA_LOKI_TOKEN: ${{ secrets.GRAFANA_LOKI_TOKEN }}
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
          TRAINING_DDP_MASTER_BASE_URL: ${{ vars.TRAINING_DDP_MASTER_BASE_URL }}
          DAGS_HUB_REPO: ${{ vars.DAGS_HUB_REPO }}
          DAGS_HUB_REPO_OWNER: ${{ vars.DAGS_HUB_REPO_OWNER }}
          GRAFANA_LOKI_URL: ${{ vars.GRAFANA_LOKI_URL }}
          GRAFANA_LOKI_LOGS_URL: ${{ vars.GRAFANA_LOKI_LOGS_URL }}
        run: echo "Environment variables set"

      # Check for any drift
      - name: Detect drift
        id: drift
        run: |
          RESULT=$(python "${{ vars.DRIFT_DETECTION_SCRIPT_PATH }}")
          echo "DRIFT=$RESULT" >> $GITHUB_ENV

      # Upload drift reports as artifact
      - name: Upload drift reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.DRIFT_REPORT_ARTIFACTS_NAME }}
          path: ${{ vars.DRIFT_REPORTS_DIR }}

      # Trigger a drift alert if any drift detected
      - name: Trigger drift alert
        if: env.DRIFT == 'True'
        run: |
          echo "::error file=drift_detector.py,line=1,col=1::Drift detected, please check drift reports."
