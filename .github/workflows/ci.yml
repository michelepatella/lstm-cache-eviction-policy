name: Continuos Integration (CI)

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:

  # -----------------------------
  # Setup
  # -----------------------------
  setup:
    runs-on: self-hosted
    outputs:
      k8s_rendered_file: ${{ steps.k8s.outputs.rendered_file }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Pull data from remote
        run: |
          # Configure DVC remote
          dvc remote modify origin endpointurl ${{ vars.DVC_REMOTE_URL }}

          # Login
          dvc remote modify origin --local access_key_id ${{ secrets.DAGS_HUB_TOKEN }}
          dvc remote modify origin --local secret_access_key ""

          # Pull
          dvc pull

      - name: Login to Azure
        shell: bash
        run: |
          # Read credentials from temp file
          echo '${{ secrets.AZURE_CREDENTIALS }}' > ${{ vars.AZURE_CREDENTIALS_TEMP_FILE }}
          CLIENT_ID=$(jq -r ${{ vars.AZURE_CREDENTIALS_CLIENT_ID_FIELD_NAME }} \
          ${{ vars.AZURE_CREDENTIALS_TEMP_FILE }})
          CLIENT_SECRET=$(jq -r ${{ vars.AZURE_CREDENTIALS_CLIENT_SECRET_FIELD_NAME }} \
          ${{ vars.AZURE_CREDENTIALS_TEMP_FILE }})
          TENANT_ID=$(jq -r ${{ vars.AZURE_CREDENTIALS_TENANT_ID_FIELD_NAME }} \
          ${{ vars.AZURE_CREDENTIALS_TEMP_FILE }})

          # Login
          az login --service-principal --username "$CLIENT_ID" \
                   --password "$CLIENT_SECRET" \
                   --tenant "$TENANT_ID"

      - name: Set up k8s manifests
        id: k8s
        env:
          GIT_HUB_SHA: ${{ github.sha }}
          K8S_OVERLAYS_CI_DIR: ${{ vars.K8S_OVERLAYS_CI_DIR }}
          K8S_RENDERED_FILE: ${{ vars.K8S_RENDERED_FILE }}
          DOCKER_IMAGES: ${{ vars.DOCKER_IMAGES }}
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          # Convert to array
          readarray -t DOCKER_IMAGES_ARRAY <<< "$DOCKER_IMAGES"

          # Inject Github SHA to all images
          cd ${K8S_OVERLAYS_CI_DIR}
          for svc in "${DOCKER_IMAGES_ARRAY[@]}"; do
              img_name=$(echo "$svc" | tr '_' '-')
              full_img="${ACR_NAME}.${{ vars.ACR_URL }}/${img_name}:${GIT_HUB_SHA}"
              kustomize edit set image "$svc=$full_img"
          done

          # Run Kustomize
          cd -
          kustomize build ${K8S_OVERLAYS_CI_DIR} > ${K8S_RENDERED_FILE}

          # Output path for downstream jobs
          echo "rendered_file=${K8S_RENDERED_FILE}" >> $GITHUB_OUTPUT

      - name: Upload rendered k8s manifests
        uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.K8S_RENDERED_ARTIFACTS_NAME }}
          path: ${{ vars.K8S_RENDERED_FILE }}

  # -----------------------------
  # Static Analysis
  # -----------------------------
  static_analysis:
    runs-on: self-hosted
    needs: setup
    steps:
      - name: Lint code
        run: pylint ${{ vars.SRC_DIR }} --fail-under=${{ vars.PYLINT_MIN_SCORE }}

      - name: Lint notebooks
        run: |
          files=$(find "${{ vars.NOTEBOOKS_DIR }}" -name '*.ipynb')
          if [ -n "$files" ]; then
            pynblint $files
          fi

      - name: Lint Dockerfiles
        run: |
          hadolint $(find . -name ${{ vars.DOCKERFILE_NAME }}) --failure-threshold \
          "${{ vars.HADOLINT_FAILURE_THRESHOLD }}"

      - name: Check code
        run: ruff check ${{ vars.CODE_DIR }} --diff

      - name: Check k8s manifests
        run: kube-score score ${{ needs.setup.outputs.k8s_rendered_file }}

  # -----------------------------
  # Security Scan
  # -----------------------------
  security_scan:
    runs-on: self-hosted
    needs: setup
    steps:
      - name: Scan code
        run: bandit -r ${{ vars.SRC_DIR }} --severity-level ${{ vars.BANDIT_SEVERITY }}

      - name: Scan dependencies
        env:
          PIP_AUDIT_IGNORE_VULNS: ${{ vars.PIP_AUDIT_IGNORE_VULNS }}
        run: |
          IGNORE_ARGS=""
          for v in $PIP_AUDIT_IGNORE_VULNS; do
            IGNORE_ARGS="$IGNORE_ARGS --ignore-vuln $v"
          done
          pip-audit $IGNORE_ARGS

      - name: Scan Docker images
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          GIT_HUB_SHA: ${{ github.sha }}
          TRIVY_IGNORE_VULNS: ${{ vars.TRIVY_IGNORE_VULNS }}
          GATEWAY_API_PORT: ${{ vars.GATEWAY_API_PORT }}
          DECIDER_SERVICE_PORT: ${{ vars.DECIDER_SERVICE_PORT }}
          DECIDER_SERVICE_CHANNEL: ${{ vars.DECIDER_SERVICE_CHANNEL }}
          FEATURIZER_SERVICE_PORT: ${{ vars.FEATURIZER_SERVICE_PORT }}
          FEATURIZER_SERVICE_CHANNEL: ${{ vars.FEATURIZER_SERVICE_CHANNEL }}
          PREDICTOR_SERVICE_PORT: ${{ vars.PREDICTOR_SERVICE_PORT }}
          PREDICTOR_SERVICE_CHANNEL: ${{ vars.PREDICTOR_SERVICE_CHANNEL }}
          SCORER_SERVICE_PORT: ${{ vars.SCORER_SERVICE_PORT }}
          SCORER_SERVICE_CHANNEL: ${{ vars.SCORER_SERVICE_CHANNEL }}
          GRAFANA_LOKI_URL: ${{ vars.GRAFANA_LOKI_URL }}
          GRAFANA_LOKI_USER_ID: ${{ vars.GRAFANA_LOKI_USER_ID }}
          GRAFANA_LOKI_TOKEN: ${{ vars.GRAFANA_LOKI_TOKEN }}
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
          DAGS_HUB_REPO_OWNER: ${{ vars.DAGS_HUB_REPO_OWNER }}
          DAGS_HUB_TOKEN: ${{ vars.DAGS_HUB_TOKEN }}
        run: |
          # Convert TRIVY_IGNORE_VULNS into a temporary .trivyignore file
          IFS=',' read -ra IGNORE_ARRAY <<< "$TRIVY_IGNORE_VULNS"
          > ${{ vars.TRIVY_IGNORE_FILE }}
          for cve in "${IGNORE_ARRAY[@]}"; do
            echo "$cve" >> ${{ vars.TRIVY_IGNORE_FILE }}
          done

          # Build and scan all the images
          readarray -t DOCKER_SERVICES_ARRAY <<< "$(echo "${{ vars.DOCKER_SERVICES }}" | tr -d '\r')"
          for img_name in "${DOCKER_SERVICES_ARRAY[@]}"; do
            img_name_normalized=$(echo "$img_name" | tr '_' '-')
            full_img="${{ secrets.ACR_NAME }}.${{ vars.ACR_URL }}/${img_name_normalized}:${{ github.sha }}"
            docker compose build "$img_name"
            trivy image \
              --exit-code ${{ vars.TRIVY_EXIT_CODE }} \
              --severity ${{ vars.TRIVY_SEVERITY }} \
              --ignorefile ${{ vars.TRIVY_IGNORE_FILE }} \
              "$full_img"
          done

      - name: Scan k8s manifests
        run: |
          checkov -d ${{ needs.setup.outputs.k8s_rendered_file }} --framework \
          ${{ vars.CHECKOV_FRAMEWORK }}

  # -----------------------------
  # Testing
  # -----------------------------
  testing:
    runs-on: self-hosted
    needs: setup
    steps:
      - name: Test code
        run: |
          export PYTHONPATH=$(pwd):$(pwd)/src
          pytest -v -m "${{ vars.PYTEST_MARKER }}" ${{ vars.CODE_TESTS_DIR }}

      - name: Test data
        run: |
          export PYTHONPATH=$(pwd):$(pwd)/src
          pytest -v -m "${{ vars.PYTEST_MARKER }}" ${{ vars.DATA_TESTS_DIR }}

      - name: Test model
        run: |
          export PYTHONPATH=$(pwd):$(pwd)/src
          pytest -v -m "${{ vars.PYTEST_MARKER }}" ${{ vars.MODEL_TESTS_DIR }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.TEST_REPORT_ARTIFACTS_NAME }}
          path: ${{ vars.TEST_REPORTS_DIR }}

  # -----------------------------
  # Build
  # -----------------------------
  build:
    runs-on: self-hosted
    needs: [setup, static_analysis, security_scan, testing]
    steps:
      - name: Build and push Docker images
        env:
          GIT_HUB_SHA: ${{ github.sha }}
          GIT_HUB_REGISTRY: ${{ vars.GIT_HUB_REGISTRY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DOCKER_HUB_USER: ${{ vars.DOCKER_HUB_USER }}
          DOCKER_HUB_REPO: ${{ vars.DOCKER_HUB_REPO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Push all the images to Docker Hub, GitHub Packages, and ACR
          readarray -t DOCKER_SERVICES_ARRAY <<< "$(echo "${{ vars.DOCKER_SERVICES }}" | tr -d '\r')"
          for svc in "${DOCKER_SERVICES_ARRAY[@]}"; do
            # Prepare image
            img_name=$(echo "$svc" | tr '_' '-')
            local_img="${{ secrets.ACR_NAME }}.${{ vars.ACR_URL }}/$img_name:${GIT_HUB_SHA}"

            # Push to Docker Hub
            docker tag "$local_img" "$DOCKER_HUB_USER/$DOCKER_HUB_REPO:$img_name"
            ghcr_img="${GIT_HUB_REGISTRY}/${GITHUB_REPOSITORY}/$img_name"
            docker tag "$local_img" "$ghcr_img:${GIT_HUB_SHA}"
            docker tag "$local_img" "$ghcr_img:latest"
            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "$DOCKER_HUB_USER" \
            --password-stdin
            docker push "$DOCKER_HUB_USER/$DOCKER_HUB_REPO:$img_name"

            # Push to GitHub Packages
            echo "${GITHUB_TOKEN}" | docker login "$GIT_HUB_REGISTRY" -u ${{ github.actor }} \
            --password-stdin
            docker push "$ghcr_img:${GIT_HUB_SHA}"
            docker push "$ghcr_img:latest"

            # Push to ACR
            echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_NAME }}.${{ vars.ACR_URL }}" \
            --username "${{ secrets.ACR_USERNAME }}" --password-stdin
            acr_img="${{ secrets.ACR_NAME }}.${{ vars.ACR_URL }}/$img_name:${GIT_HUB_SHA}"
            docker tag "$local_img" "$acr_img"
            docker push "$acr_img"

            # Remove local images
            docker rmi -f "$local_img" \
                  "$DOCKER_HUB_USER/$DOCKER_HUB_REPO:$img_name" \
                  "$ghcr_img:${GIT_HUB_SHA}" \
                  "$ghcr_img:latest" \
                  "$acr_img" || true
          done

      - name: Build docs
        run: |
          PYTHONPATH=$(pwd)/${{ vars.SRC_DIR }} pdoc --html ${{ vars.SRC_DIR }}/ \
          --output-dir ${{ vars.DOCS_OUTPUT_DIR }} --force

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.DOCS_ARTIFACTS_NAME }}
          path: ${{ vars.DOCS_OUTPUT_DIR }}
