name: Continuos Integration (CI)

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:

      # ---------------------------
      # Setup
      # ---------------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ${{ env.PIP_CACHE }}

      - name: Microsoft Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ env.REQUIREMENTS_FILE }}
          pip install -r ${{ env.REQUIREMENTS_DEV_FILE }}

      # ---------------------------
      # Code checks
      # ---------------------------
      - name: Check code quality
        run: ruff check ${{ env.CODE_DIR }} --diff

      - name: Check code security
        run: bandit -r ${{ env.SRC_DIR }} -ll

      # ---------------------------
      # Linting
      # ---------------------------
      - name: Lint code
        run: pylint ${{ env.SRC_DIR }} --fail-under=${{ env.PYLINT_MIN_SCORE }}

      - name: Lint notebooks
        run: pynblint ${{ env.NOTEBOOKS_DIR }}/

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: ${{ env.HADOLINT_RECURSIVE }}

      # ---------------------------
      # Dependency checks
      # ---------------------------
      - name: Check dependency conflicts
        run: pip check

      - name: Check dependency vulnerabilities
        run: pip-audit --fail-on ${{ env.PIP_AUDIT_FAIL_ON }}

      # ---------------------------
      # K8s checks
      # ---------------------------
      - name: Check k8s manifests
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.K8S_MANIFEST_FILES }}
          framework: ${{ env.K8S_FRAMEWORK }}

      - name: Check k8s readiness
        uses: piraces/kube-score-ga@v0.1.3
        with:
          manifests-folders: ${{ env.K8S_MANIFEST_FILES }}

      # ---------------------------
      # Testing
      # ---------------------------
      - name: Run tests
        run: |
          export PYTHONPATH=${{ env.SRC_DIR }}:${{ env.COMPONENTS_DIR }}
          pytest -v -m "${{ env.PYTEST_MARKER }}" ${{ env.TESTS_DIR }}

      # ---------------------------
      # Docker image checks
      # ---------------------------
      - name: Check Docker images
        run: |
          # Setup Docker buildx
          docker buildx create --use

          # Build Docker images
          docker-compose build --no-cache

          # Install Trivy dynamically
          TRIVY_LATEST_URL=$(curl -s ${{ env.TRIVY_LATEST_RELEASE_URL }} \
          | grep ${{ env.TRIVY_JSON_FIELD }} \
          | grep ${{ env.TRIVY_PLATFORM }} \
          | cut -d '"' -f 4)
          wget $TRIVY_LATEST_URL -O ${{ env.TRIVY_OUTPUT_FILE }}
          sudo ${{ env.TRIVY_INSTALL_CMD }} ${{ env.TRIVY_OUTPUT_FILE }}

          # Scan Docker images
          readarray -t DOCKER_IMAGES_ARRAY <<< "${{ env.DOCKER_IMAGES }}"
          for img_name in "${DOCKER_IMAGES_ARRAY[@]}"; do
              img="${{ secrets.ACR_NAME }}.azurecr.io/${img_name}:${{ github.sha }}"
              trivy image --exit-code ${{ env.TRIVY_EXIT_CODE }} --severity ${{ env.TRIVY_SEVERITY }} $img
          done

      # ---------------------------
      # Docker images push
      # ---------------------------
      - name: Push Docker images
        run: |
          # Microsoft Azure login
          az acr login --name ${{ secrets.ACR_NAME }}

          # Push all the images
          readarray -t DOCKER_IMAGES_ARRAY <<< "${{ env.DOCKER_IMAGES }}"
          for img_name in "${DOCKER_IMAGES_ARRAY[@]}"; do
            img="${{ secrets.ACR_NAME }}.azurecr.io/${img_name}:${{ github.sha }}"
            docker push $img
          done

      # ---------------------------
      # Docs generation
      # ---------------------------
      - name: Generate docs
        run: |
          PYTHONPATH=$(pwd)/${{ env.SRC_DIR }} pdoc --html ${{ env.SRC_DIR }}/ --output-dir ${{ env.DOCS_OUTPUT_DIR }} --force
