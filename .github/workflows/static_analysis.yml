name: Static Analysis

on:
  push:
    branches:
      - main
      - feature/*
  pull_request:
    branches: [main]

jobs:
  static_analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check code quality
        run: ruff check . --diff

      - name: Check code security
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src:$(pwd)/components
          bandit -r src -ll

      - name: Lint code
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/src
          SCORE=$(pylint src --disable=import-error | tee pylint.log | grep "Your code has been rated at" | awk '{print $7}' | cut -d'/' -f1)
          if (( $(echo "$SCORE < 8" | bc -l) )); then
            exit 1
          fi

      - name: Lint notebook
        run: |
          pynblint notebooks/
