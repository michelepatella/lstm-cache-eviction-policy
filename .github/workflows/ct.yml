# Continuous Training (CT): Automate model retraining ensuring
# that the ML model stays up-to-date
name: Continuous Training (CT)

# Kill the current workflow if a
# new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Run the workflow on demand and every
# Monday at 3 a.m.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

# The workflow is organized into a single job:
# - Retraining:
#     - Checkout repository:
#         Checkout the repository on the current branch.
#     - Set environment variables:
#         Load and set environment variables required.
#     - Retrain model:
#         Retrain the model on new data.
#     - Upload test reports:
#         Upload test reports as artifact.
jobs:

  # ----------------------------------------
  # Retraining
  # ----------------------------------------
  retraining:
    runs-on: self-hosted
    steps:
      # Checkout the repository on
      # the current branch
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref || github.ref }}

      # Set environment variables needed
      - name: Set environment variables
        env:
          DAGS_HUB_TOKEN: ${{ secrets.DAGS_HUB_TOKEN }}
          GRAFANA_LOKI_USER_ID: ${{ secrets.GRAFANA_LOKI_USER_ID }}
          GRAFANA_LOKI_TOKEN: ${{ secrets.GRAFANA_LOKI_TOKEN }}
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
          TRAINING_DDP_MASTER_BASE_URL: ${{ vars.TRAINING_DDP_MASTER_BASE_URL }}
          DAGS_HUB_REPO: ${{ vars.DAGS_HUB_REPO }}
          DAGS_HUB_REPO_OWNER: ${{ vars.DAGS_HUB_REPO_OWNER }}
          GRAFANA_LOKI_URL: ${{ vars.GRAFANA_LOKI_URL }}
          GRAFANA_LOKI_LOGS_URL: ${{ vars.GRAFANA_LOKI_LOGS_URL }}
        run: echo "Environment variables set"

      # Retrain model
      - name: Retrain model
        run: |
          make dvc_pipeline_stage_run STAGE_NAME=training

      # Upload test reports as artifact
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ vars.TEST_REPORT_ARTIFACTS_NAME }}
          path: ${{ vars.TEST_REPORTS_DIR }}
