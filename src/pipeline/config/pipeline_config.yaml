data:
  general:
    requests: 100000
    keys:
      min: 1
      max: 100
    mode: static
  synthetic:
    patterns:
      access:
        zipf:
          alpha:
            fixed: 1.0
            min: 0.5
            max: 1.5
          steps: 5
        behavior:
          repetition:
            interval: 40
            offset: 10
            hours:
              start: 4
              end: 9
          toggle:
            interval: 2
            hours:
              start: 9
              end: 14
            base_requests:
              first: 2
              second: 3
            offsets:
              forward: 1
              backward: 2
          cycle:
            base: 20
            mod: 7
            divisor: 100
            hours:
              start: 14
              end: 19
          distortion:
            interval: 1
            hours:
              start: 19
              end: 23
            offsets:
              history: 15
              correction: 10
            noise:
              min: 5
              max: 10
          memory:
            interval: 80
            offset: 10
      temporal:
        burstiness:
          high: 0.3
          low: 2.0
          hours:
            start: 10
            end: 18
        periodic:
          scale: 120
          amplitude: 60
dataset:
  cleaning:
    missing_values_removal:
      dropna:
        how: any
  splits:
    training: 0.8
    validation: 0.2
data_loader:
  training:
    batch_size: 512
    shuffle: false
  validation:
    batch_size: 512
    shuffle: false
  testing:
    batch_size: 512
    shuffle: false
early_stopping:
  training:
    patience: 10
    delta: 0.0001
  validation:
    patience: 3
    delta: 0.0005
evaluation:
  simulations:
    metrics:
      mistake_rate:
        window: 200
logs:
  level: DEBUG
loss:
  class_weight:
    type: balanced
  reduction: null
model:
  params:
    hidden_size: 128
    num_layers: 2
    bias: false
    batch_first: true
    dropout: 0.1
    bidirectional: false
    proj_size: 0
  sequence:
    length: 25
    embedding:
      dimension: 32
  optimizations:
    pruning:
      amount: 0.2
    quantization:
      dtype: qint8
      engine: qnnpack
optimizer:
  params:
    learning_rate: 0.001
    momentum: 0.9
    weight_decay: 0.05
  type: adamw
resources:
  general:
    num_cpus: 4
    num_gpus: 0
  devices:
    training: cpu
    testing: cpu
    validation: cpu
seed:
  value: 42
simulations:
  api_kwargs:
    conf_weight: 0.7
    conf_level: 0.95
    excluded_keys: []
    mc_dropout_samples: 10
    num_evictions: 1
    prob_weight: 0.3
    rollout_horizon: 3
    time_step_increment: 0.02
  caches:
    dimension: 10
    ttl: 100000
training:
  epochs: 500
validation:
  time_series_cv:
    folds: 5
    epochs: 5
  search_space:
    model:
      hidden_size:
      - 128
      - 256
      num_layers:
      - 2
      - 3
      dropout:
      - 0.1
      - 0.3
    optimizer:
      learning_rate:
      - 0.001
      - 0.0005
