api_kwargs:
  conf_weight: 0.2
  confidence_level: 0.95
  excluded_keys: []
  mc_dropout_samples: 5
  num_evictions: 1
  prob_weight: 0.8
  return_all_scores: false
  return_api_kwargs: false
  return_prob_conf: false
  rollout_horizon: 3
  time_step_increment: 0.02
caches:
  dimension: 10
  ttl: 10000
data:
  general:
    mode: real
    keys:
      min: 1
      max: 200
    requests: 200000
  synthetic:
    patterns:
      access:
        zipf:
          alpha:
            fixed: 1.2
            min: 0.5
            max: 1.5
          steps: 5
        behavior:
          repetition:
            interval: 7
            offset: 3
            hours:
              start: 4
              end: 9
          toggle:
            interval: 20
            hours:
              start: 9
              end: 14
            base_requests:
              first: 1
              second: 2
            offsets:
              forward: 1
              backward: 2
          cycle:
            base: 5
            mod: 2
            divisor: 100
            hours:
              start: 14
              end: 19
          distortion:
            interval: 4
            hours:
              start: 19
              end: 23
            offsets:
              history: 2
              correction: 1
            noise:
              min: 0
              max: 1
          memory:
            interval: 5
            offset: 3
      temporal:
        burstiness:
          high: 0.8
          low: 1.2
          hours:
            start: 10
            end: 18
        periodic:
          scale: 90
          amplitude: 50
    seed: 42
dataset:
  cleaning:
    missing_values_removal:
      dropna:
        how: any
  splits:
    training: 0.8
    validation: 0.2
evaluation:
  simulations:
    metrics:
      mistake_rate:
        window: 200
logs:
  level: DEBUG
loss:
  class_weight:
    type: balanced
model:
  params:
    hidden_size: 128
    num_layers: 2
    bias: false
    batch_first: true
    dropout: 0.3
    bidirectional: false
    proj_size: 0
  sequence:
    length: 25
    embedding:
      dimension: 32
  optimizations:
    pruning:
      amount: 0.2
    quantization:
      dtype: qint8
      engine: qnnpack
optimizer:
  params:
    learning_rate: 0.001
    momentum: 0.9
    weight_decay: 0.05
  type: adamw
testing:
  device:
    type: cpu
  general:
    batch_size: 128
    shuffle: false
training:
  device:
    type: cpu
  general:
    epochs: 500
    batch_size: 128
    num_workers: 6
    shuffle: true
  early_stopping:
    patience: 10
    delta: 0.0001
validation:
  device:
    type: cpu
  general:
    batch_size: 128
    shuffle: false
  time_series_cv:
    folds: 5
    epochs: 5
  early_stopping:
    patience: 5
    delta: 0.0005
  search_space:
    model:
      hidden_size:
      - 128
      - 256
      num_layers:
      - 2
      - 3
      dropout:
      - 0.1
      - 0.3
    optimizer:
      learning_rate:
      - 0.001
      - 0.0005
