hardware:
  device:
    type: cpu
kwargs:
  rollout_horizon:
    default: 5
    max: 50
  mc_dropout_samples:
    default: 25
    max: 100
  confidence_level:
    default: 0.95
  time_step_increment:
    default: 0.02
    max: 5.0
  num_evictions:
    default: 1
  excluded_keys:
    default: [ ]
  unbiased_variance:
    default: true
  prob_weight:
    default: 0.8
  conf_weight:
    default: 0.2
  return_all_scores:
    default: false
  return_prob_conf:
    default: false
  return_api_kwargs:
    default: false
model:
  optimizations:
    quantization:
      engine: qnnpack