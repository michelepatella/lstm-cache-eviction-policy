syntax = "proto3";

package scorer_service;

message ScorerServiceRequest {
    repeated float outputs = 1;
    repeated float variances = 2;
    float conf_level = 3;
    float conf_weight = 4;
}

message ScorerServiceResponse {
    repeated float key_scores = 1;
}

service ScorerService {
    rpc Score(ScorerServiceRequest) returns (ScorerServiceResponse);
}
