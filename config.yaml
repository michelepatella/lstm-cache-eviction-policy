hardware:
  device: mps

data:
  generation:
    seed: 42
    mode: static
    requests: 200000
    keys:
      min: 1
      max: 500
    pattern:
      access:
        zipf:
          alpha:
            fixed: 1.5
            min: 0.5
            max: 2.0
          steps: 5
        behavior:
          repetition:
            interval: 7
            offset: 3
            hours:
              start: 4
              end: 9
          toggle:
            interval: 20
            hours:
              start: 9
              end: 14
            base_requests:
              first: 1
              second: 2
            offsets:
              forward: 1
              backward: 2
          cycle:
            base: 5
            mod: 2
            divisor: 100
            hours:
              start: 14
              end: 19
          distortion:
            interval: 4
            hours:
              start: 19
              end: 23
            offsets:
              history: 2
              correction: 1
            noise:
              min: 0
              max: 1
          memory:
            interval: 5
            offset: 3
      temporal:
        burstiness:
          high: 0.8
          low: 1.2
          hours:
            start: 10
            end: 18
        periodic:
          scale: 90
          amplitude: 50

dataset:
  split:
    training: 0.7
    validation: 0.2

model:
  general:
    features: 2
  params:
    hidden_size: 128
    num_layers: 2
    bias: false
    batch_first: true
    dropout: 0.3
    bidirectional: false
    proj_size: 0
  sequence:
    length: 25
    embedding:
      dimension: 32

validation:
  general:
    batch_size: 128
    shuffle: false
  cross_validation:
    folds: 10
    epochs: 10
  early_stopping:
    patience: 5
    delta: 0.0005
  search_space:
    model:
      hidden_size_range: [128, 256]
      num_layers_range: [2, 3]
      dropout_range: [0.1, 0.3]
    training:
      optimizer:
        learning_rate_range: [0.001, 0.0005]

training:
  general:
    batch_size: 128
    shuffle: true
    epochs: 500
  optimizer:
    type: adamw
    params:
      learning_rate: 0.0005
      weight_decay: 0.05
      momentum: 0.9
  early_stopping:
    patience: 10
    delta: 0.0001

testing:
  general:
    batch_size: 128
    shuffle: false
  metrics:
    top_k: 3

simulation:
  cache:
    dimension: 100
    ttl: 1800
  metrics:
    mistake_rate:
      window: 100