data:
  distribution:
    seed: 42
    mode: static
    requests:
      count: 30000
    keys:
      min: 1
      max: 30
  pattern:
    access:
      zipf:
        alpha:
          fixed: 0.8
          min: 0.5
          max: 2.0
        steps: 5
      behavior:
        repetition:
          interval: 7
          offset: 3
        toggle:
          interval: 10
        cycle:
          base: 5
          mod: 3
          divisor: 50
        distortion:
          interval: 4
        noise:
          min: -2
          max: 3
        memory:
          interval: 9
          offset: 6
    temporal:
      burstiness:
        high: 0.8
        low: 1.2
        hours:
          start: 10
          end: 18
      periodic:
        scale: 90
        amplitude: 50
  sequence:
    length: 25
    embedding:
      dimension: 32
  dataset:
    split:
      train: 0.7
      validation: 0.25
    paths:
      static: data/static_access_logs.csv
      dynamic: data/dynamic_access_logs.csv

model:
  general:
    features:
      count: 2
    path: model/trained_lstm.pt
  params:
    hidden_size: 128
    num_layers: 2
    bias: false
    batch_first: true
    dropout: 0.3
    bidirectional: false
    proj_size: 0

validation:
  cross_validation:
    folds:
      count: 10
    epochs:
      count: 15
  early_stopping:
    patience: 5
    delta: 0.0005
  search_space:
    model:
      hidden_size_range: [128, 256]
      num_layers_range: [2, 3]
      dropout_range: [0.1, 0.3]
    training:
      optimizer:
        learning_rate_range: [0.001, 0.005]

training:
  general:
    epochs:
      count: 500
    batch_size: 64
  optimizer:
    type: adamw
    params:
      learning_rate: 0.005
      weight_decay: 0.05
      momentum: 0.9
  early_stopping:
    patience: 20
    delta: 0.0001

testing:
  batch_size: 64

evaluation:
  top_k: 3

inference:
  confidence_intervals:
    level: 0.95
  mc_dropout:
    samples:
      count: 50

simulation:
  general:
    dimension: 5
    ttl: 180
  lstm:
    prediction:
      interval: 5
    threshold: 0.5