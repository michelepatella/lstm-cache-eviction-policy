version: "3.9"
services:
  gateway:
    build: .
    container_name: gateway
    command: uvicorn src.api.gateway.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - predictor
      - scorer
    environment:
      PREDICTOR_SERVICE_URL: "http://predictor:8001/predict"
      SCORER_SERVICE_URL: "http://scorer:8002/score"

  predictor:
    build: .
    container_name: predictor
    command: uvicorn src.api.predictor_service.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"

  scorer:
    build: .
    container_name: scorer
    command: uvicorn src.api.scorer_service.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"